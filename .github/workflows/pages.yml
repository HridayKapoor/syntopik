name: Deploy Syntopik Studio Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "dashboard.html"
      - "knowledge-graph/viewer.html"
      - "syntopik/**"
      - "scripts/build_demo_site.py"
      - "packs/**"
      - ".github/workflows/pages.yml"
  schedule:
    # Weekly rebuild so the demo's due dates and streaks stay relative to today.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Static Studio Demo (docs/)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rebuild demo site from current sources (+ static checks)
        run: python -B scripts/build_demo_site.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
